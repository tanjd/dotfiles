name: Test install scripts

on:
  push:
  pull_request:

jobs:
  install-sh:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: ./install.sh

  install-wsl-sh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./install.wsl.sh

  install-macos-sh:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./install.macos.sh

  install-macos-dev-sh:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./install.macos-dev.sh
        env:
          # Skip GUI casks (font, VS Code) — slow and flaky on hosted runners.
          # Formulae (colima, docker, ...) and the symlink step still run.
          HOMEBREW_BUNDLE_CASK_SKIP: "font-jetbrains-mono visual-studio-code"

  install-macos-personal-sh:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./install.macos-personal.sh
        env:
          # Skip GUI casks — slow and flaky on hosted runners. This Brewfile
          # is cask-only, so this job mainly guards against a syntax error.
          HOMEBREW_BUNDLE_CASK_SKIP: "obsidian tailscale claude"
