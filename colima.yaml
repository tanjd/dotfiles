# Applied only when a new colima profile is first created
# (config precedence: defaults -> template -> profile -> CLI flags).
# M1-optimized: native aarch64 VM via Apple's Virtualization.framework,
# virtiofs mounts for fast filesystem I/O, rosetta for occasional amd64 images.
cpu: 4
memory: 4
arch: aarch64
vmType: vz
mountType: virtiofs
rosetta: true
